# oaken-provider-maildir: read mail from a local Maildir, as a provider Oaken can sync.
[project]
name = "oaken-provider-maildir"
version = "0.1.0"
description = "An Oaken provider that reads mail from a local Maildir."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "oaken-core>=0.2.1",
]

[project.entry-points."oaken.providers"]
maildir = "oaken_provider_maildir:MaildirProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaken_provider_maildir"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
