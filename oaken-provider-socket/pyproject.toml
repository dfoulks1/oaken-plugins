# oaken-provider-socket: send things to a socket and they are submitted to Oaken Core's intake.
[project]
name = "oaken-provider-socket"
version = "0.1.0"
description = "An Oaken Core provider: whatever is sent to its socket is submitted to intake, line by line or one item per connection."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "oaken-core",
]

# Discovery: Oaken Core finds a provider through this entry point. The name is the plugin's name,
# so its settings live in [plugins.provider.socket].
[project.entry-points."oaken_core.providers"]
socket = "oaken_provider_socket:SocketProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaken_provider_socket"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
