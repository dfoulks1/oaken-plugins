# oaken-plugins: the plugins for Oaken Core, in one distribution. Each is a subpackage named <kind>_<name> and declares
# no entry point: `oaken plugin add NAME` finds it in `oaken_plugins`, and nothing loads until someone adds it.
[project]
name = "oaken-plugins"
version = "1.0.0"
description = "Plugins for Oaken Core: formatters, triagers and more, one subpackage each."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["oaken", "plugins", "mail", "imap", "smtp", "gmail", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "oaken-core>=1.0.0,<2",
]

# A plugin whose library is heavy or rarely wanted asks for it as an extra: `pip install oaken-plugins[imap]`. The plugin imports the
# library only when it connects, so it can be listed and added without it.
[project.optional-dependencies]
imap = ["imapclient>=4.1.0"]
smtp = ["aiosmtplib>=5.1.3"]

[project.urls]
Repository = "https://github.com/dfoulks1/oaken-plugins"
Issues = "https://github.com/dfoulks1/oaken-plugins/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaken_plugins"]

[tool.uv.sources]
# Develop against the local Oaken Core checkout next door; a published install uses the version pinned above.
oaken-core = { path = "../oaken-core", editable = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
