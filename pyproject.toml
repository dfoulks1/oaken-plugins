# oaken-plugins: the plugins for Oaken Core, in one distribution. Each is a subpackage named <kind>_<name> and declares
# no entry point: `oaken plugin add NAME` finds it in `oaken_plugins`, and nothing loads until someone adds it.
[project]
name = "oaken-plugins"
version = "1.0.0"
description = "Plugins for Oaken Core: formatters, triagers and more, one subpackage each."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["oaken", "plugins", "mail", "imap", "smtp", "gmail", "llm"]
classifiers = [
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "oaken-core>=1.0.0,<2",
]

# `pip install oaken-plugins[kind.name]` (or `[kind-name]`: pip reads the two as one) brings the libraries that plugin needs. The wheel always
# carries every plugin; an extra picks dependencies, and a plugin does nothing until `plugin add kind.name`. An empty extra means the plugin
# needs nothing beyond oaken-core. `imap`, `smtp` and `clean` are the older group names, kept for 1.x; `all` is every plugin's libraries.
# tests/test_extras.py keeps this table in step with what each plugin imports.
[project.optional-dependencies]
imap = ["oaken-plugins[provider.imap]"]
smtp = ["oaken-plugins[provider.smtp]"]
clean = ["oaken-plugins[formatter.rfc822]"]  # the rfc822 formatter's safe mode turns HTML into text with it; without it, safe mode cleans the plain text part only
all = ["oaken-plugins[provider.imap,provider.smtp,formatter.rfc822]"]
"action.exec" = []
"embedder.lmstudio" = []
"embedder.ollama" = []
"enricher.sentiment" = []
"formatter.cve" = []
"formatter.ini" = []
"formatter.rfc822" = ["selectolax>=1.0.1"]
"gateway.localname" = []
"ingestor.cve" = []
"ingestor.mail" = []
"llm_backend.lmstudio" = []
"llm_backend.ollama" = []
"llm_backend.ollama-remote" = []
"provider.exec" = []
"provider.gmail" = []
"provider.imap" = ["imapclient>=4.1.0"]
"provider.jmap" = []
"provider.jsonl" = []
"provider.maildir" = []
"provider.mbox" = []
"provider.smtp" = ["aiosmtplib>=5.1.3"]
"triager.cve" = []
"triager.eol" = []
"triager.filters" = []
"triager.hackernews" = []
"triager.kev" = []
"triager.sieve" = []
"triager.spamfilter" = []

[project.urls]
Repository = "https://github.com/dfoulks1/oaken-plugins"
Issues = "https://github.com/dfoulks1/oaken-plugins/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaken_plugins"]
exclude = ["tests/", "docs/"]  # each plugin keeps its tests and its docs beside the code; neither ships

[tool.uv.sources]
# Develop against the local Oaken Core checkout next door; a published install uses the version pinned above.
oaken-core = { path = "../oaken-core", editable = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",  # the Sieve safety tests are property tests
    "ruff",
    "mypy",
    "sqlc-bin>=1.31.1.post1",  # generates typed query code from queries/*.sql; no hand-written SQL in a plugin
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "tests"]  # tests/ holds the helpers more than one plugin shares
testpaths = ["tests", "src"]  # tests/ is cross-plugin; each plugin keeps its own under src/oaken_plugins/<kind>_<name>/tests

[tool.ruff]
extend-exclude = ["src/oaken_plugins/*/dbgen"]  # generated by sqlc: regenerate, never hand-edit

[tool.ruff.lint]
# rules the code already answers with `# noqa` comments but the default set does not run: keep those comments
external = ["S", "E402", "E731", "N", "ASYNC109", "PLC0415", "PT011"]
