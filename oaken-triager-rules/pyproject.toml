# oaken-triager-rules: the owner's own deterministic triage rules for Oaken Core's intake.
[project]
name = "oaken-triager-rules"
version = "0.1.0"
description = "An Oaken Core triager: ordered rules of your own, each a set of conditions on an item and what to decide. No model."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "oaken-core",
]

# Discovery: the name is the plugin's name, so its settings live in [plugins.triager.rules].
[project.entry-points."oaken_core.triagers"]
rules = "oaken_triager_rules:RulesTriager"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaken_triager_rules"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
