# oaken-provider-mbox: read mail from a local mbox file, as a provider Oaken can sync.
[project]
name = "oaken-provider-mbox"
version = "0.1.0"                     # its own clock, not Oaken's
description = "An Oaken provider that reads mail from a local mbox file."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "oaken-core>=0.2.1",             # the Oaken whose plugin contract this speaks
]

# Discovery: Oaken finds a provider through this entry point. The name is the plugin's name,
# so its settings live in [plugins.provider.mbox].
[project.entry-points."oaken.providers"]
mbox = "oaken_provider_mbox:MboxProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaken_provider_mbox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
