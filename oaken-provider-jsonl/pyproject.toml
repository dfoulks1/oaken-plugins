# oaken-provider-jsonl: pipe JSON Lines into Oaken Core's intake.
[project]
name = "oaken-provider-jsonl"
version = "0.1.0"
description = "An Oaken Core provider: JSON Lines piped in on the command line (or sent to the API) become items in intake."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "oaken-core",
]

# Discovery: Oaken Core finds a provider through this entry point. The name is the plugin's name,
# so its settings live in [plugins.provider.jsonl] and its command is `oaken jsonl ingest`.
[project.entry-points."oaken_core.providers"]
jsonl = "oaken_provider_jsonl:JsonlProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaken_provider_jsonl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
